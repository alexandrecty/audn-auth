<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retour AUDN</title>
<style>body{margin:0}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root {
    --ground: #f6f7f8;
    --panel: #ffffff;
    --ink: #15181c;
    --muted: #5b636d;
    --rule: #dde1e6;
    --accent: #1f5f5b;
    --sans: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --serif: "IBM Plex Serif", ui-serif, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1013;
      --panel: #15181c;
      --ink: #e5e8ec;
      --muted: #98a0ab;
      --rule: #242a31;
      --accent: #74c2b9;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1013;
    --panel: #15181c;
    --ink: #e5e8ec;
    --muted: #98a0ab;
    --rule: #242a31;
    --accent: #74c2b9;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.65;
  }
  .sheet {
    max-width: 44rem;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 56px 72px;
  }

  .masthead { border-bottom: 1px solid var(--rule); padding-bottom: 22px; margin-bottom: 36px; }
  .eyebrow {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(1.7rem, 1.2rem + 2vw, 2.3rem);
    line-height: 1.15;
    letter-spacing: -0.015em;
    text-wrap: balance;
    margin: 0 0 14px;
  }
  .stamp { font-family: var(--sans); font-size: 0.85rem; color: var(--muted); margin: 0; }

  h2 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 1.08rem;
    letter-spacing: -0.005em;
    text-wrap: balance;
    margin: 40px 0 12px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .masthead + h2 { margin-top: 0; padding-top: 0; border-top: none; }

  p { margin: 0 0 16px; }
  strong { font-weight: 600; }
  em { color: var(--muted); }

  ol, ul { margin: 0 0 16px; padding-left: 1.3em; }
  li { margin-bottom: 9px; }
  li::marker { color: var(--muted); font-family: var(--sans); font-size: 0.9em; }

  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  .contact {
    font-family: var(--sans);
    font-size: 0.92rem;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    padding: 16px 18px;
    margin-top: 40px;
  }
  .contact p { margin: 0; }
  .contact p + p { margin-top: 6px; color: var(--muted); }
</style>

</head>
<body>
<div class="sheet">
  <header class="masthead">
    <p class="eyebrow">AUDN</p>
    <h1 id="titre">Retour de votre banque</h1>
    <p class="stamp" id="stamp">Lecture de la réponse…</p>
  </header>

  <p id="etat">Un instant.</p>

  <div class="contact" id="bloc-code" hidden>
    <p><strong>Code d'autorisation reçu.</strong> Si AUDN ne s'ouvre pas, copiez-le et collez-le
    dans l'application.</p>
    <p><code id="brut"></code></p>
  </div>

  <div class="contact" id="bloc-erreur" hidden>
    <p><strong>La banque ou Enable Banking a renvoyé une erreur.</strong></p>
    <p><code id="err"></code></p>
  </div>

  <p id="p-lien" hidden><a class="bouton" id="lien" href="#">Ouvrir AUDN</a></p>
</div>
<style>
  .bouton {
    display: inline-block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    color: var(--ground);
    background: var(--accent);
    padding: 11px 20px;
    border-radius: 6px;
  }
  code { font-size: 0.82rem; word-break: break-all; color: var(--ink); }
</style>
<script>
  (function () {
    // ⚠️ CETTE PAGE N'A PLUS LE DROIT DE SAUTER AVANT D'AVOIR AFFICHÉ.
    //
    // La version précédente faisait `location.replace("audn://…")` en première instruction. Sur un
    // Mac, `audn://` n'a pas de gestionnaire : le navigateur affichait une erreur et l'activation
    // « échouait sur la fin » — alors que la banque avait dit oui. Pire : quand Enable Banking
    // renvoyait `?error=…`, la page le jetait avant qu'on puisse le lire, donc la panne ne disait
    // jamais sa cause.
    //
    // Désormais : on AFFICHE d'abord, toujours. Le rebond vers l'app n'est tenté que là où il peut
    // aboutir — iOS/iPadOS — et il ne détruit plus la page s'il échoue.
    var brut = (window.location.search + window.location.hash).replace(/^[?#]/, "");
    var p = new URLSearchParams(window.location.search.slice(1));
    var h = new URLSearchParams(window.location.hash.slice(1));
    function lire(k) { return p.get(k) || h.get(k); }

    var code = lire("code");
    var erreur = lire("error");
    var detail = lire("error_description") || lire("error_message");

    var titre = document.getElementById("titre");
    var stamp = document.getElementById("stamp");
    var etat = document.getElementById("etat");

    if (erreur) {
      titre.textContent = "L'autorisation n'a pas abouti";
      stamp.textContent = "Rien n'a été connecté.";
      etat.textContent = "Voici ce que le service a répondu, mot pour mot :";
      document.getElementById("err").textContent = detail ? (erreur + " — " + detail) : erreur;
      document.getElementById("bloc-erreur").hidden = false;
      return;
    }

    if (!code) {
      titre.textContent = "Rien à traiter";
      stamp.textContent = "Cette page attend un retour de banque.";
      etat.textContent = "Aucun code d'autorisation n'accompagne cette adresse. Si vous l'avez "
        + "ouverte directement, c'est normal : elle ne sert qu'à la fin d'une connexion bancaire.";
      return;
    }

    titre.textContent = "Autorisation reçue";
    stamp.textContent = "Votre banque a accepté.";
    document.getElementById("brut").textContent = brut;
    document.getElementById("bloc-code").hidden = false;

    var cible = "audn://enablebanking/callback?" + brut;
    document.getElementById("lien").setAttribute("href", cible);
    document.getElementById("p-lien").hidden = false;

    // Le rebond automatique n'a de sens que là où l'app existe. Ailleurs il ne produit qu'une
    // erreur de navigateur par-dessus une page qui, elle, dit la vérité.
    var estIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (estIOS) {
      etat.textContent = "Ouverture d'AUDN…";
      window.setTimeout(function () { window.location.href = cible; }, 400);
    } else {
      etat.textContent = "Cet appareil n'a pas AUDN installée. Ouvrez AUDN sur votre iPhone, "
        + "ou copiez le code ci-dessous.";
    }
  })();
</script>
</body>
</html>
